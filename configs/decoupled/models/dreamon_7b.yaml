# DreamOn-v0-7B 模型配置
model_configuration:
  model_name: Dream-org/DreamOn-v0-7B
  tokenizer_name: Dream-org/DreamOn-v0-7B
  torch_dtype: bfloat16
  device_map: cuda
  trust_remote_code: true
  steps: 300
  gen_length: 300
  temperature: 0.8
  remasking: entropy
  model_specific_arguments:
    alg_temp: 0
    output_history: false
    expand_budget: 100

# 默认评估参数
evaluation_config:
  num_samples: 600
  batch_size: 1
  tqdm: true
  ppl_model_name: Qwen/Qwen3-8B
