# LLaDA-8B-Instruct 模型配置
model_configuration:
  model_name: GSAI-ML/LLaDA-8B-Instruct
  tokenizer_name: GSAI-ML/LLaDA-8B-Instruct
  torch_dtype: bfloat16
  device_map: cuda
  trust_remote_code: true
  steps: 300
  gen_length: 300
  temperature: 0.5
  remasking: random
  model_specific_arguments:
    cfg_scale: 0.0
    mask_id: 126336
    block_length: 25

# 默认评估参数（可被 dataset/override 覆盖）
evaluation_config:
  num_samples: 200
  batch_size: 1
  tqdm: true
  ppl_model_name: Qwen/Qwen3-8B
